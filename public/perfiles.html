<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Perfiles</title>
<link rel="stylesheet" href="style.css">
<script src="store.js"></script>
<style>
  h1 { margin: 8rem 0 2.5rem; font-size: 3.2rem; text-align: center; }
  #pick, #make { text-align: center; }
  #make { display: none; }
  #tiles { white-space: nowrap; }
  .pt { display: inline-block; width: 14rem; margin: 0 1.5rem; vertical-align: top; }
  .pface { width: 12rem; height: 12rem; margin: 0 auto; border-radius: 50%; font-size: 5.5rem; line-height: 12rem; font-weight: bold; color: #000; border: .4rem solid transparent; }
  .pt.sel .pface { border-color: #fff; }
  .pn { margin-top: 1rem; font-size: 1.8rem; color: #bbb; }
  .pt.sel .pn { color: #fff; }
  .pk { font-size: 1.2rem; color: #f47521; }
  #pmsg { margin-top: 2rem; font-size: 1.5rem; color: #ffb27a; min-height: 2rem; }
  #phint { position: fixed; bottom: 2rem; left: 0; right: 0; text-align: center; font-size: 1.3rem; color: #888; }
  #nbox { margin: 0 auto 1rem; width: 50%; padding: .8rem 1.4rem; font-size: 2.4rem; background: #1c1c24; border-radius: .6rem; min-height: 3rem; }
  #nbox.empty { color: #777; }
  #kopt { margin-bottom: 1.2rem; font-size: 1.5rem; color: #bbb; }
  #kb { width: 70%; margin: 0 auto; }
  .krow { overflow: hidden; }
  .k { float: left; width: 9%; margin: 0 .5% .6rem; padding: .9rem 0; text-align: center; font-size: 1.7rem; background: #1c1c24; border-radius: .5rem; }
  .k.kl { font-size: 1.05rem; padding: 1.25rem 0; }
  .k.on { background: #2d6; color: #000; }
  .k.sel { background: #f47521; color: #000; }
</style>
</head>
<body>
<div id="pick"><h1>¿Quién está viendo?</h1><div id="tiles"></div><div id="pmsg"></div></div>
<div id="make"><h1>Nuevo perfil</h1><div id="nbox" class="empty">Escribe el nombre...</div><div id="kopt"></div><div id="kb"></div></div>
<div id="phint"></div>

<script>
  var COLORS = ['#f47521', '#3aa0ff', '#43c466', '#e0457b', '#a56bff', '#ffc533'];
  var KEYS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZÑ0123456789'.split('').concat(['ESP', 'BORRAR', 'INFANTIL', 'CREAR', 'CANCELAR']);
  var KC = 10;
  var profiles = [], mode = 'pick', pi = 0, ki = 0, name = '', kids = false, delArm = 0, kbEls = [];

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) { e.className = cls; }
    if (text !== undefined) { e.appendChild(document.createTextNode(text)); }
    return e;
  }
  function req(method, url, body, ok, fail) {
    var x = new XMLHttpRequest();
    x.open(method, url);
    if (body) { x.setRequestHeader('Content-Type', 'application/json'); }
    x.timeout = 15000;
    x.onload = function () {
      var j = null;
      try { j = JSON.parse(x.responseText); } catch (e) {}
      if (x.status >= 200 && x.status < 300) { ok(j); } else if (fail) { fail(j); }
    };
    x.onerror = x.ontimeout = function () { if (fail) { fail(null); } };
    x.send(body ? JSON.stringify(body) : null);
  }

  /* ── Elegir perfil ── */
  function choose(p) {
    try { localStorage.setItem('lastchosen', p.id); } catch (e) {}
    sessionStorage.setItem('pid', p.id);
    sessionStorage.setItem('pname', p.name);
    sessionStorage.setItem('pkids', p.kids ? '1' : '0');
    location.replace('index.html');
  }

  function loadProfiles(selectId) {
    req('GET', '/api/profiles', null, function (l) {
      profiles = l || [];
      var last = selectId || localStorage.getItem('lastchosen'), i;
      pi = 0;
      for (i = 0; i < profiles.length; i++) { if (profiles[i].id === last) { pi = i; } }
      mode = 'pick';
      render();
    }, function () { $('pmsg').innerText = 'No se pudo conectar con la PC.'; });
  }

  function renderPick() {
    $('pick').style.display = 'block'; $('make').style.display = 'none';
    var t = $('tiles'), i, p, d, f;
    t.innerHTML = '';
    for (i = 0; i < profiles.length; i++) {
      p = profiles[i];
      d = el('div', 'pt');
      f = el('div', 'pface', p.name.charAt(0).toUpperCase());
      f.style.background = COLORS[p.color % COLORS.length];
      d.appendChild(f);
      d.appendChild(el('div', 'pn', p.name));
      d.appendChild(el('div', 'pk', p.kids ? 'Infantil' : '\u00a0'));
      (function (pp, idx) { d.onclick = function () { pi = idx; choose(pp); }; })(p, i);
      t.appendChild(d);
    }
    if (profiles.length < 8) {
      d = el('div', 'pt');
      f = el('div', 'pface', '+'); f.style.background = '#333'; f.style.color = '#fff';
      d.appendChild(f);
      d.appendChild(el('div', 'pn', 'Añadir'));
      d.appendChild(el('div', 'pk', '\u00a0'));
      d.onclick = function () { pi = profiles.length; startMake(); };
      t.appendChild(d);
    }
    $('phint').innerText = '← → elegir   |   OK entrar   |   Rojo: borrar perfil   |   Atrás: volver';
    markPick();
  }
  function markPick() {
    var ts = $('tiles').children, i;
    for (i = 0; i < ts.length; i++) { ts[i].className = 'pt' + (i === pi ? ' sel' : ''); }
  }

  /* ── Crear perfil (con teclado en pantalla) ── */
  function startMake() {
    mode = 'make'; name = ''; kids = false; ki = 0;
    render();
  }
  function renderMake() {
    $('pick').style.display = 'none'; $('make').style.display = 'block';
    if (!kbEls.length) {
      var kb = $('kb'), row = null, i, k;
      for (i = 0; i < KEYS.length; i++) {
        if (i % KC === 0) { row = el('div', 'krow'); kb.appendChild(row); }
        k = el('div', 'k' + (KEYS[i].length > 3 ? ' kl' : ''), KEYS[i]);
        (function (idx) { k.onclick = function () { ki = idx; press(idx); markMake(); }; })(i);
        row.appendChild(k); kbEls.push(k);
      }
    }
    $('phint').innerText = 'Escribe el nombre y elige CREAR   |   Atrás: cancelar';
    markMake();
  }
  function markMake() {
    var i;
    $('nbox').innerText = name || 'Escribe el nombre...';
    $('nbox').className = name ? '' : 'empty';
    $('kopt').innerText = 'Perfil infantil: ' + (kids ? 'Sí (oculta contenido para adultos)' : 'No');
    for (i = 0; i < kbEls.length; i++) {
      kbEls[i].className = 'k' + (KEYS[i].length > 3 ? ' kl' : '') + (KEYS[i] === 'INFANTIL' && kids ? ' on' : '') + (i === ki ? ' sel' : '');
    }
  }
  function press(i) {
    var key = KEYS[i];
    if (key === 'ESP') { if (name && name.length < 12) { name += ' '; } }
    else if (key === 'BORRAR') { name = name.slice(0, -1); }
    else if (key === 'INFANTIL') { kids = !kids; }
    else if (key === 'CANCELAR') { mode = 'pick'; render(); return; }
    else if (key === 'CREAR') { create(); return; }
    else if (name.length < 12) { name += key; }
  }
  function create() {
    var n = name.replace(/^\s+|\s+$/g, '');
    if (!n) { return; }
    req('POST', '/api/profiles', { name: n, kids: kids }, function (p) { loadProfiles(p && p.id); }, function (e) {
      mode = 'pick'; render(); $('pmsg').innerText = (e && e.error) || 'No se pudo crear el perfil.';
    });
  }

  function render() { if (mode === 'pick') { renderPick(); } else { renderMake(); } }

  /* ── Control remoto ── */
  document.addEventListener('keydown', function (e) {
    var k = e.keyCode, n = KEYS.length;
    if (mode === 'pick') {
      var total = profiles.length + (profiles.length < 8 ? 1 : 0);
      $('pmsg').innerText = '';
      if (k === 37 && pi > 0) { pi--; }
      else if (k === 39 && pi < total - 1) { pi++; }
      else if (k === 13) { if (pi < profiles.length) { choose(profiles[pi]); } else { startMake(); } return; }
      else if (k === 403) {   // rojo: borrar (hay que pulsarlo dos veces)
        if (pi < profiles.length && profiles.length > 1) {
          if (Date.now() - delArm < 4000) {
            var id = profiles[pi].id;
            if (sessionStorage.getItem('pid') === id) { sessionStorage.removeItem('pid'); }
            req('DELETE', '/api/profiles/' + id, null, function () { delArm = 0; loadProfiles(); });
          } else {
            delArm = Date.now();
            $('pmsg').innerText = 'Pulsa rojo otra vez para borrar "' + profiles[pi].name + '" y todos sus datos';
          }
        }
      }
      else if (k === 461 || k === 27 || k === 8) {
        if (sessionStorage.getItem('pid')) { history.back(); } else { window.close(); }
      }
      else { return; }
      e.preventDefault();
      markPick();
      return;
    }

    // Crear perfil
    if (k === 461 || k === 27) { e.preventDefault(); mode = 'pick'; render(); return; }
    if ((k >= 48 && k <= 57) || (k >= 65 && k <= 90) || k === 32) {
      if (!e.ctrlKey && name.length < 12) { name += String.fromCharCode(k); markMake(); e.preventDefault(); }
      return;
    }
    if (k === 8) { name = name.slice(0, -1); markMake(); e.preventDefault(); return; }
    var rowI = Math.floor(ki / KC), lastRow = Math.floor((n - 1) / KC);
    if (k === 37) { if (ki % KC > 0) { ki--; } }
    else if (k === 39) { if (ki % KC < KC - 1 && ki < n - 1) { ki++; } }
    else if (k === 38) { if (ki >= KC) { ki -= KC; } }
    else if (k === 40) { if (ki + KC < n) { ki += KC; } else if (rowI < lastRow) { ki = n - 1; } }
    else if (k === 13) { press(ki); }
    else { return; }
    e.preventDefault();
    if (mode === 'make') { markMake(); }
  });

  loadProfiles();
</script>
</body>
</html>
