<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Buscar</title>
<link rel="stylesheet" href="style.css">
<script src="store.js"></script>
<style>
  #qbox { margin: 6.5rem 3rem 1rem; padding: .8rem 1.4rem; font-size: 2.2rem; line-height: 3rem; min-height: 3rem; background: #1c1c24; border-radius: .6rem; }
  #qbox.empty { color: #777; }
  #kb { padding: 0 3rem; }
  .krow { overflow: hidden; }
  .k { float: left; width: 9%; margin: 0 .5% .6rem; padding: .9rem 0; text-align: center; font-size: 1.7rem; background: #1c1c24; border-radius: .5rem; }
  .k.sel { background: #f47521; color: #000; }
  #smsg { margin: .5rem 3rem; font-size: 1.5rem; color: #ffb27a; min-height: 2rem; }
</style>
</head>
<body>
<div class="vt" style="position:fixed;top:0;margin:0;padding:1.5rem 3rem;font-size:2rem;z-index:5;">Buscar</div>
<div id="view"><div id="scroller">
  <div id="qbox" class="empty">Escribe para buscar...</div>
  <div id="kb"></div>
  <div id="smsg"></div>
  <div id="res" class="grid"></div>
</div></div>

<script>
  var KEYS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZÑ0123456789'.split('').concat(['ESP', 'BORRAR']);
  var KC = 10;   // teclas por fila (cada fila se crea con exactamente KC teclas)
  var RC = 6;    // tarjetas por fila de resultados
  var zone = 'kb', ki = 0, ri = 0, q = '', results = [], timer = null, xhr = null;
  var kbEls = [], resEls = [];

  function $(id) { return document.getElementById(id); }
  function rem(n) { return n * parseFloat(window.getComputedStyle(document.documentElement).fontSize); }
  function img(u) { return '/api/img?u=' + encodeURIComponent(u); }
  function setY(y) {
    var css = 'translateY(' + (-Math.max(0, Math.round(y))) + 'px)';
    var s = $('scroller');
    s.style.webkitTransform = css; s.style.transform = css;
  }

  // Teclado en pantalla: una fila por cada KC teclas.
  (function () {
    var row = null, i, k;
    for (i = 0; i < KEYS.length; i++) {
      if (i % KC === 0) { row = document.createElement('div'); row.className = 'krow'; $('kb').appendChild(row); }
      k = document.createElement('div');
      k.className = 'k';
      k.appendChild(document.createTextNode(KEYS[i]));
      (function (idx) { k.onclick = function () { zone = 'kb'; ki = idx; press(idx); mark(); }; })(i);
      row.appendChild(k);
      kbEls.push(k);
    }
  })();

  function mark() {
    var j;
    for (j = 0; j < kbEls.length; j++) { kbEls[j].className = 'k' + (zone === 'kb' && j === ki ? ' sel' : ''); }
    for (j = 0; j < resEls.length; j++) { resEls[j].className = 'card' + (zone === 'res' && j === ri ? ' sel' : ''); }
    setY(zone === 'res' && resEls[ri] ? resEls[ri].offsetTop - rem(14) : 0);
  }

  function updateQ() {
    $('qbox').innerText = q ? q : 'Escribe para buscar...';
    $('qbox').className = q ? '' : 'empty';
    clearTimeout(timer);
    timer = setTimeout(doSearch, 700);   // busca solo cuando dejas de escribir
  }

  function doSearch() {
    if (xhr) { xhr.abort(); }
    var term = q.replace(/^\s+|\s+$/g, '');
    $('res').innerHTML = ''; results = []; resEls = []; ri = 0;
    if (term.length < 2) { $('smsg').innerText = ''; mark(); return; }
    $('smsg').innerText = 'Buscando...';
    var mine = xhr = new XMLHttpRequest();
    mine.open('GET', '/api/search?q=' + encodeURIComponent(term) + (sessionStorage.getItem('pkids') === '1' ? '&kids=1' : ''));
    mine.timeout = 90000;
    mine.onload = function () {
      var j = null;
      try { j = JSON.parse(mine.responseText); } catch (e) {}
      if (mine.status !== 200 || !j) { $('smsg').innerText = 'Error al buscar.'; return; }
      results = j.results || [];
      $('smsg').innerText = results.length ? results.length + ' resultados' : 'Sin resultados para "' + term + '"';
      for (var n = 0; n < results.length; n++) { addCard(results[n], n); }
      mark();
    };
    mine.onerror = mine.ontimeout = function () { $('smsg').innerText = 'Error de conexión.'; };
    mine.send();
  }

  function addCard(a, idx) {
    var c = document.createElement('div'); c.className = 'card';
    var cv = document.createElement('div'); cv.className = 'cover';
    if (a.image) { cv.style.backgroundImage = 'url(' + img(a.image) + ')'; }
    var t = document.createElement('div'); t.className = 't';
    t.appendChild(document.createTextNode(a.title));
    c.appendChild(cv); c.appendChild(t);
    c.onclick = function () { abrir(results[idx]); };
    $('res').appendChild(c);
    resEls.push(c);
  }

  function press(i) {
    var key = KEYS[i];
    if (key === 'ESP') { q += ' '; }
    else if (key === 'BORRAR') { q = q.slice(0, -1); }
    else { q += key; }
    updateQ();
  }

  function abrir(a) {
    sessionStorage.setItem('anime', JSON.stringify(a));
    location.href = 'anime.html?url=' + encodeURIComponent(a.url);
  }

  document.addEventListener('keydown', function (e) {
    var k = e.keyCode, n = KEYS.length;
    if (k === 461 || k === 27) { e.preventDefault(); history.back(); return; }

    // Escribir directo: teclado del PC o números del control.
    if ((k >= 48 && k <= 57) || (k >= 65 && k <= 90) || k === 32) {
      if (!e.ctrlKey) { q += String.fromCharCode(k); updateQ(); e.preventDefault(); }
      return;
    }
    if (k === 8) { q = q.slice(0, -1); updateQ(); e.preventDefault(); return; }

    if (zone === 'kb') {
      var rowI = Math.floor(ki / KC), lastRow = Math.floor((n - 1) / KC);
      if (k === 37) { if (ki % KC > 0) { ki--; } }
      else if (k === 39) { if (ki % KC < KC - 1 && ki < n - 1) { ki++; } }
      else if (k === 38) { if (ki >= KC) { ki -= KC; } }
      else if (k === 40) {
        if (ki + KC < n) { ki += KC; }
        else if (rowI < lastRow) { ki = n - 1; }                 // última fila más corta
        else if (results.length) { zone = 'res'; ri = 0; }
      }
      else if (k === 13) { press(ki); }
      else { return; }
    } else {
      var rn = results.length;
      if (k === 37) { if (ri > 0) { ri--; } }
      else if (k === 39) { if (ri < rn - 1) { ri++; } }
      else if (k === 38) { if (ri >= RC) { ri -= RC; } else { zone = 'kb'; } }
      else if (k === 40) {
        if (ri + RC < rn) { ri += RC; }
        else if (Math.floor((rn - 1) / RC) > Math.floor(ri / RC)) { ri = rn - 1; }
      }
      else if (k === 13) { abrir(results[ri]); return; }
      else { return; }
    }
    e.preventDefault();
    mark();
  });

  mark();
</script>
</body>
</html>
